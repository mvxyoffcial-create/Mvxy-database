<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add TV Series</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #282c34; color: #fff; padding: 20px; line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; background: #3b404a; padding: 25px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #b0b0b0; }
        input[type="text"], input[type="number"], input[type="date"], select, textarea { width: 100%; padding: 10px; box-sizing: border-box; background: #4a505b; border: 1px solid #555; color: #fff; border-radius: 6px; }
        .btn-primary { background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%); color: #fff; border: none; padding: 12px 20px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .btn-secondary { background: #555; color: #fff; border: none; padding: 10px 15px; cursor: pointer; border-radius: 6px; }
        .season-container { border: 1px dashed #777; padding: 15px; border-radius: 8px; margin-top: 20px; background: #323842; }
        .episode-container { margin-top: 10px; padding-left: 20px; border-left: 2px solid #6a11cb; }

        /* Episode card layout */
        .episode-row { margin-bottom: 14px; background: #3b404a; padding: 12px 14px; border-radius: 8px; border: 1px solid #4a505b; }
        .episode-row .ep-name-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
        .episode-row .ep-name-row input { flex: 1; font-size: 13px; }
        .episode-row .ep-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 6px; }
        .episode-row .ep-grid input { font-size: 12px; padding: 7px 9px; }
        .ep-section-label { font-size: 11px; font-weight: bold; color: #8a8a8a; text-transform: uppercase; letter-spacing: 0.5px; margin: 6px 0 3px; }
        .ep-subtitle-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
        .ep-subtitle-row input { font-size: 12px; padding: 7px 9px; }
        .ep-file-size-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 6px 0; }
        .ep-file-size-row input { font-size: 12px; padding: 7px 9px; }

        .remove-btn { background: #ff4d4d; color: #fff; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
        h2 { color: #6a11cb; border-bottom: 2px solid #6a11cb; padding-bottom: 5px; margin-top: 30px; }
        h3 { color: #8a2be2; margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
        .screenshot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .help-text { font-size: 12px; color: #999; margin-top: 5px; font-style: italic; }
        .inline-group { display: flex; gap: 15px; }
        .inline-group .form-group { flex: 1; }
        .section-box { background: #323842; padding: 15px; border-radius: 8px; margin-bottom: 20px; }

        /* colour-coded input placeholders for episode grid */
        .ep-video input::placeholder    { color: #7db3ff; }
        .ep-download input::placeholder { color: #7dff9e; }
        .ep-telegram input::placeholder { color: #36bffa; }
        .ep-torrent input::placeholder  { color: #f5a623; }
        .ep-sub input::placeholder      { color: #d47aff; }
        .ep-size input::placeholder     { color: #ff6b6b; }

        .file-size-badge {
            display: inline-block;
            background: #6a11cb;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 8px;
            color: #fff;
        }

        .quality-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .quality-header label {
            margin-bottom: 0;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📺 Add New TV Series</h1>
        <form id="add-tv-form">
            <div class="section-box">
                <div class="form-group">
                    <label for="tmdb-id">TMDB TV Series ID:</label>
                    <div class="inline-group">
                        <input type="number" id="tmdb-id" placeholder="e.g. 1399">
                        <button type="button" class="btn-primary" onclick="fetchTmdbDetails()">Fetch Details</button>
                    </div>
                </div>
            </div>
            
            <h2>📋 Basic Information</h2>
            <div class="section-box">
                <div class="inline-group">
                    <div class="form-group">
                        <label for="title">Title:</label>
                        <input type="text" id="title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="language">Language:</label>
                        <input type="text" id="language" name="language">
                    </div>
                </div>
                
                <div class="inline-group">
                    <div class="form-group">
                        <label for="release-date">Release Date:</label>
                        <input type="date" id="release-date" name="release_date">
                    </div>
                    <div class="form-group">
                        <label for="rating">Rating:</label>
                        <input type="number" step="0.1" id="rating" name="rating">
                    </div>
                    <div class="form-group">
                        <label for="total_seasons">Total Seasons:</label>
                        <input type="number" id="total_seasons" name="total_seasons" min="1">
                    </div>
                </div>
                
                <div class="inline-group">
                    <div class="form-group">
                        <label for="source_type">Source Type:</label>
                        <select id="source_type" name="source_type">
                            <option value="original">Original</option>
                            <option value="camcopy">CamCopy</option>
                            <option value="bluray">BluRay</option>
                            <option value="webrip">WebRip</option>
                            <option value="web-dl">Web-DL</option>
                            <option value="hdrip">HDRIP</option>
                            <option value="dvdrip">DVDRip</option>
                            <option value="brrip">BRRip</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="file_type">File Type:</label>
                        <select id="file_type" name="file_type">
                            <option value="webrip">WebRip</option>
                            <option value="bluray">BluRay</option>
                            <option value="web-dl">Web-DL</option>
                            <option value="hdrip">HDRIP</option>
                            <option value="dvd">DVD</option>
                            <option value="brrip">BRRip</option>
                            <option value="bdrip">BDRip</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="status">TV Series Status:</label>
                    <input type="text" id="status" name="status" placeholder="Ongoing, Finished, Cancelled">
                </div>
                
                <div class="form-group">
                    <label for="youtube_trailer">YouTube Trailer URL:</label>
                    <input type="text" id="youtube_trailer" name="youtube_trailer">
                    <div class="help-text">Paste YouTube URL or Video ID</div>
                </div>
                
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" name="description" rows="4"></textarea>
                </div>
                
                <div class="inline-group">
                    <div class="form-group">
                        <label for="poster-url">Poster URL:</label>
                        <input type="text" id="poster-url" name="thumbnail">
                    </div>
                    <div class="form-group">
                        <label for="backdrop-url">Backdrop Image URL:</label>
                        <input type="text" id="backdrop-url" name="backdrop">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="genres">Genres (comma-separated):</label>
                    <input type="text" id="genres" name="genres">
                </div>
                
                <div class="form-group">
                    <label for="cast-members">Cast (JSON):</label>
                    <textarea id="cast-members" name="cast_members" rows="5"></textarea>
                </div>
            </div>

            <h2>📝 Series-Level Subtitles</h2>
            <div class="section-box">
                <div class="form-group">
                    <label for="sub_sinhala">Sinhala Subtitle URL:</label>
                    <input type="text" id="sub_sinhala" name="sub_sinhala" placeholder="https://example.com/sinhala.srt">
                </div>
                <div class="form-group">
                    <label for="sub_english">English Subtitle URL:</label>
                    <input type="text" id="sub_english" name="sub_english" placeholder="https://example.com/english.srt">
                </div>
            </div>

            <h2>📸 Screenshots</h2>
            <div class="section-box">
                <h3>720p Screenshots</h3>
                <div class="screenshot-grid">
                    <input type="text" id="screenshots_720p_1" placeholder="URL 1">
                    <input type="text" id="screenshots_720p_2" placeholder="URL 2">
                </div>
                <h3>1080p Screenshots</h3>
                <div class="screenshot-grid">
                    <input type="text" id="screenshots_1080p_1" placeholder="URL 1">
                    <input type="text" id="screenshots_1080p_2" placeholder="URL 2">
                </div>
                <h3>2160p Screenshots</h3>
                <div class="screenshot-grid">
                    <input type="text" id="screenshots_2160p_1" placeholder="URL 1">
                    <input type="text" id="screenshots_2160p_2" placeholder="URL 2">
                </div>
                <h3>Trailer Screenshots</h3>
                <div class="screenshot-grid">
                    <input type="text" id="screenshots_trailer_1" placeholder="URL 1">
                    <input type="text" id="screenshots_trailer_2" placeholder="URL 2">
                </div>
            </div>

            <h2>🔗 TV Series Global Links</h2>
            <div class="section-box">
                <div class="form-group">
                    <label>Video Links (720p | 1080p | 2160p)</label>
                    <div class="inline-group">
                        <input type="text" id="tv_video_720p" placeholder="720p Video">
                        <input type="text" id="tv_video_1080p" placeholder="1080p Video">
                        <input type="text" id="tv_video_2160p" placeholder="2160p Video">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>File Sizes for Download Links <span class="file-size-badge">Required for Direct Downloads</span></label>
                    <div class="inline-group">
                        <input type="text" id="file_size_720p" placeholder="720p Size (e.g. 800MB)">
                        <input type="text" id="file_size_1080p" placeholder="1080p Size (e.g. 1.8GB)">
                        <input type="text" id="file_size_2160p" placeholder="2160p Size (e.g. 5.5GB)">
                    </div>
                    <div class="help-text">Example: 800MB, 1.2GB, 2.5GB, 5.5GB</div>
                </div>

                <div class="form-group">
                    <label>Download Links</label>
                    <div class="inline-group">
                        <input type="text" id="download_720p" placeholder="720p Download">
                        <input type="text" id="download_1080p" placeholder="1080p Download">
                        <input type="text" id="download_2160p" placeholder="2160p Download">
                    </div>
                </div>

                <div class="form-group">
                    <label>Telegram Links</label>
                    <div class="inline-group">
                        <input type="text" id="telegram_720p" placeholder="720p Telegram">
                        <input type="text" id="telegram_1080p" placeholder="1080p Telegram">
                        <input type="text" id="telegram_2160p" placeholder="2160p Telegram">
                    </div>
                </div>

                <div class="form-group">
                    <label>Torrent Links</label>
                    <div class="inline-group">
                        <input type="text" id="torrent_720p" placeholder="720p Torrent">
                        <input type="text" id="torrent_1080p" placeholder="1080p Torrent">
                        <input type="text" id="torrent_2160p" placeholder="2160p Torrent">
                    </div>
                </div>
            </div>

            <h2>📺 Seasons & Episodes</h2>
            <div id="seasons-container"></div>
            <button type="button" class="btn-secondary" onclick="addSeason()">Add Season</button>
            
            <br><br>
            <button type="submit" class="btn-primary" style="width:100%; font-size: 1.2em; padding: 15px;">Add TV Series</button>
        </form>
    </div>

    <script>
        const API_BASE_URL = window.location.origin + '/api/admin';
        const AUTH_HEADER = 'Basic ' + btoa('venura:venura');
        let seasonCount = 0;

        function addSeason() {
            seasonCount++;
            const container = document.getElementById('seasons-container');
            const seasonDiv = document.createElement('div');
            seasonDiv.classList.add('season-container');
            seasonDiv.innerHTML = `
                <h3>Season ${seasonCount} <button type="button" class="remove-btn" onclick="this.closest('.season-container').remove()">Remove Season</button></h3>
                <div class="episode-container" data-season-number="${seasonCount}"></div>
                <button type="button" class="btn-secondary" onclick="addEpisode(this)">+ Add Episode</button>
            `;
            container.appendChild(seasonDiv);
        }

        function addEpisode(button) {
            const container = button.previousElementSibling;
            const sNum = container.dataset.seasonNumber;
            const epNum = container.children.length + 1;
            const div = document.createElement('div');
            div.classList.add('episode-row');
            div.innerHTML = `
                <!-- Episode name row -->
                <div class="ep-name-row">
                    <input type="text" name="s${sNum}_e${epNum}_name" placeholder="Episode ${epNum} Name" required style="flex:1;">
                    <button type="button" class="remove-btn" onclick="this.closest('.episode-row').remove()">✕</button>
                </div>

                <!-- Video streams -->
                <div class="ep-section-label">🎬 Video (Stream)</div>
                <div class="ep-grid ep-video">
                    <input type="text" placeholder="720p Video URL">
                    <input type="text" placeholder="1080p Video URL">
                    <input type="text" placeholder="2160p Video URL">
                </div>

                <!-- File Sizes for Episode Downloads -->
                <div class="ep-section-label">📦 File Sizes <span style="color: #ff6b6b; font-size: 10px;">(for direct download links)</span></div>
                <div class="ep-file-size-row ep-size">
                    <input type="text" placeholder="720p Size (e.g. 800MB)">
                    <input type="text" placeholder="1080p Size (e.g. 1.8GB)">
                    <input type="text" placeholder="2160p Size (e.g. 5.5GB)">
                </div>

                <!-- Download links -->
                <div class="ep-section-label">⬇️ Download</div>
                <div class="ep-grid ep-download">
                    <input type="text" placeholder="720p Download">
                    <input type="text" placeholder="1080p Download">
                    <input type="text" placeholder="2160p Download">
                </div>

                <!-- Telegram links -->
                <div class="ep-section-label">✈️ Telegram</div>
                <div class="ep-grid ep-telegram">
                    <input type="text" placeholder="720p Telegram">
                    <input type="text" placeholder="1080p Telegram">
                    <input type="text" placeholder="2160p Telegram">
                </div>

                <!-- Torrent links -->
                <div class="ep-section-label">🧲 Torrent</div>
                <div class="ep-grid ep-torrent">
                    <input type="text" placeholder="720p Torrent">
                    <input type="text" placeholder="1080p Torrent">
                    <input type="text" placeholder="2160p Torrent">
                </div>

                <!-- Subtitles -->
                <div class="ep-section-label">💬 Subtitles</div>
                <div class="ep-subtitle-row ep-sub">
                    <input type="text" placeholder="English Subtitle URL (.srt / .vtt)">
                    <input type="text" placeholder="Sinhala Subtitle URL (.srt / .vtt)">
                </div>
            `;
            container.appendChild(div);
        }

        async function fetchTmdbDetails() {
            const tmdbId = document.getElementById('tmdb-id').value;
            if (!tmdbId) return alert('Enter TMDB ID');
            try {
                const res = await fetch(`${API_BASE_URL}/tmdb_fetch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': AUTH_HEADER },
                    body: JSON.stringify({ tmdb_id: tmdbId, media_type: 'tv' })
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('title').value = data.title || '';
                    document.getElementById('description').value = data.description || '';
                    document.getElementById('poster-url').value = data.thumbnail || '';
                    document.getElementById('backdrop-url').value = data.backdrop || '';
                    document.getElementById('release-date').value = data.release_date || '';
                    document.getElementById('language').value = data.language || '';
                    document.getElementById('rating').value = data.rating || '';
                    document.getElementById('total_seasons').value = data.total_seasons || 1;
                    document.getElementById('genres').value = data.genres ? data.genres.join(', ') : '';
                    document.getElementById('cast-members').value = JSON.stringify(data.cast_members || [], null, 2);
                }
            } catch (err) { alert('Fetch failed'); }
        }

        document.getElementById('add-tv-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileType = document.getElementById('file_type').value;

            // Collect file sizes for series-level download links
            const fileSize720p = document.getElementById('file_size_720p').value.trim() || null;
            const fileSize1080p = document.getElementById('file_size_1080p').value.trim() || null;
            const fileSize2160p = document.getElementById('file_size_2160p').value.trim() || null;

            const seasons = {};
            document.querySelectorAll('.season-container').forEach((sDiv, sIdx) => {
                const sNum = sIdx + 1;
                const episodes = [];

                sDiv.querySelectorAll('.episode-row').forEach((row, eIdx) => {
                    const nameInput = row.querySelector('.ep-name-row input');

                    const videoInputs = row.querySelectorAll('.ep-video input');
                    const sizeInputs = row.querySelectorAll('.ep-size input');
                    const dlInputs = row.querySelectorAll('.ep-download input');
                    const tgInputs = row.querySelectorAll('.ep-telegram input');
                    const torrentInputs = row.querySelectorAll('.ep-torrent input');
                    const subInputs = row.querySelectorAll('.ep-sub input');

                    const v = (inp, i) => inp[i] ? inp[i].value.trim() : '';

                    const epFileSize720p = v(sizeInputs, 0) || null;
                    const epFileSize1080p = v(sizeInputs, 1) || null;
                    const epFileSize2160p = v(sizeInputs, 2) || null;

                    // Direct downloads include file_size
                    const download720p = v(dlInputs, 0) ? { 
                        url: v(dlInputs, 0), 
                        file_type: fileType,
                        file_size: epFileSize720p || fileSize720p
                    } : null;
                    
                    const download1080p = v(dlInputs, 1) ? { 
                        url: v(dlInputs, 1), 
                        file_type: fileType,
                        file_size: epFileSize1080p || fileSize1080p
                    } : null;
                    
                    const download2160p = v(dlInputs, 2) ? { 
                        url: v(dlInputs, 2), 
                        file_type: fileType,
                        file_size: epFileSize2160p || fileSize2160p
                    } : null;

                    episodes.push({
                        episode_number: eIdx + 1,
                        episode_name: nameInput ? nameInput.value.trim() : '',

                        // Stream
                        video_720p:  v(videoInputs, 0) || null,
                        video_1080p: v(videoInputs, 1) || null,
                        video_2160p: v(videoInputs, 2) || null,

                        // Download
                        download_720p: download720p,
                        download_1080p: download1080p,
                        download_2160p: download2160p,

                        // Telegram (plain URLs without file_size)
                        telegram_720p:  v(tgInputs, 0) || null,
                        telegram_1080p: v(tgInputs, 1) || null,
                        telegram_2160p: v(tgInputs, 2) || null,

                        // Torrent (plain URLs without file_size)
                        torrent_720p:  v(torrentInputs, 0) || null,
                        torrent_1080p: v(torrentInputs, 1) || null,
                        torrent_2160p: v(torrentInputs, 2) || null,

                        // Per-episode subtitles
                        subtitles: {
                            english: v(subInputs, 0) ? [v(subInputs, 0)] : [],
                            sinhala: v(subInputs, 1) ? [v(subInputs, 1)] : []
                        }
                    });
                });

                seasons[`season_${sNum}`] = { 
                    season_number: sNum, 
                    total_episodes: episodes.length,
                    episodes 
                };
            });

            const getVal = (id) => document.getElementById(id).value.trim() || null;

            let castMembers = [];
            try {
                castMembers = JSON.parse(getVal('cast-members') || '[]');
            } catch (err) {
                alert('Invalid JSON in Cast field.');
                return;
            }

            const data = {
                type: 'tv',
                title: getVal('title'),
                description: getVal('description'),
                thumbnail: getVal('poster-url'),
                backdrop: getVal('backdrop-url'),
                release_date: getVal('release-date'),
                language: getVal('language'),
                rating: parseFloat(getVal('rating')) || null,
                status: getVal('status'),
                source_type: getVal('source_type'),
                file_type: fileType,
                youtube_trailer: getVal('youtube_trailer'),
                subtitles: {
                    sinhala: getVal('sub_sinhala') ? [getVal('sub_sinhala')] : [],
                    english: getVal('sub_english') ? [getVal('sub_english')] : []
                },
                genres: getVal('genres') ? getVal('genres').split(',').map(g => g.trim()) : [],
                cast_members: castMembers,
                screenshots_720p:  [getVal('screenshots_720p_1'), getVal('screenshots_720p_2')].filter(Boolean),
                screenshots_1080p: [getVal('screenshots_1080p_1'), getVal('screenshots_1080p_2')].filter(Boolean),
                screenshots_2160p: [getVal('screenshots_2160p_1'), getVal('screenshots_2160p_2')].filter(Boolean),
                screenshots_trailer: [getVal('screenshots_trailer_1'), getVal('screenshots_trailer_2')].filter(Boolean),
                video_720p:  getVal('tv_video_720p'),
                video_1080p: getVal('tv_video_1080p'),
                video_2160p: getVal('tv_video_2160p'),
                file_size_720p: fileSize720p,
                file_size_1080p: fileSize1080p,
                file_size_2160p: fileSize2160p,
                telegram_720p:  getVal('telegram_720p'),
                telegram_1080p: getVal('telegram_1080p'),
                telegram_2160p: getVal('telegram_2160p'),
                torrent_720p:  getVal('torrent_720p'),
                torrent_1080p: getVal('torrent_1080p'),
                torrent_2160p: getVal('torrent_2160p'),
                download_720p: getVal('download_720p'),
                download_720p_2: null,
                download_720p_3: null,
                download_1080p: getVal('download_1080p'),
                download_1080p_2: null,
                download_1080p_3: null,
                download_2160p: getVal('download_2160p'),
                download_2160p_2: null,
                download_2160p_3: null,
                seasons: Object.keys(seasons).length > 0 ? seasons : null,
                total_seasons: Object.keys(seasons).length
            };

            console.log('Submitting TV series with data:', data);

            try {
                const res = await fetch(`${API_BASE_URL}/media`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': AUTH_HEADER },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) {
                    alert('TV Series Added Successfully!');
                    window.location.href = '/admin/search_and_edit';
                } else {
                    alert('Error: ' + (result.message || 'Failed to add TV series'));
                }
            } catch (err) { 
                console.error(err);
                alert('Error saving TV series'); 
            }
        });
    </script>
</body>
</html>
